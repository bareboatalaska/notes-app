<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Nunito+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f0f12;--bg2:#1a1a21;--bg3:#242430;--bg4:#2e2e3d;
    --txt:#f0eeff;--txt2:#9e9bb8;--txt3:#6a677f;
    --acc:#7c6af5;--acc2:#5c4fd4;--red:#e05c5c;--green:#4ecb91;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{
    height:100%;width:100%;overflow:hidden;
    font-family:'Nunito Sans',sans-serif;
    background:var(--bg);color:var(--txt);
  }
  .app{
    display:flex;flex-direction:column;
    height:100dvh;max-width:480px;
    margin:0 auto;position:relative;overflow:hidden;
  }

  /* ── TOP BAR ── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:max(16px, env(safe-area-inset-top)) 18px 12px;
    border-bottom:0.5px solid var(--border);
    background:var(--bg);flex-shrink:0;
  }
  .topbar-left{}
  .topbar-date{font-family:'Nunito',sans-serif;font-size:20px;font-weight:700;color:var(--txt);line-height:1.2}
  .topbar-wday{font-size:12px;color:var(--txt3);margin-top:2px;letter-spacing:0.04em}
  .topbar-badge{
    background:var(--bg3);border:0.5px solid var(--border2);
    border-radius:20px;padding:4px 12px;
    font-size:11px;color:var(--txt3);letter-spacing:0.06em;
    font-family:'Nunito',sans-serif;font-weight:600;text-transform:uppercase;
  }

  /* ── DAY STRIP ── */
  .day-strip{
    display:flex;gap:7px;padding:10px 14px;
    overflow-x:auto;border-bottom:0.5px solid var(--border);
    scrollbar-width:none;flex-shrink:0;
  }
  .day-strip::-webkit-scrollbar{display:none}
  .day-pill{
    min-width:50px;padding:7px 6px 6px;border-radius:22px;
    border:0.5px solid var(--border2);background:var(--bg2);
    text-align:center;cursor:pointer;flex-shrink:0;
    transition:background 0.15s,border-color 0.15s;
    user-select:none;
  }
  .day-pill.active{background:var(--acc2);border-color:var(--acc)}
  .day-pill-name{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.07em;font-weight:600}
  .day-pill.active .day-pill-name{color:rgba(255,255,255,0.65)}
  .day-pill-num{font-size:18px;font-weight:700;color:var(--txt);margin-top:1px;font-family:'Nunito',sans-serif}
  .day-pill.active .day-pill-num{color:#fff}
  .day-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);margin:3px auto 0;opacity:0}
  .day-pill.has-notes .day-pill-dot{opacity:1}
  .day-pill.active .day-pill-dot{background:rgba(255,255,255,0.5)}

  /* ── NOTES LIST ── */
  .notes-scroll{
    flex:1;overflow-y:auto;
    padding:14px 14px 8px;
    display:flex;flex-direction:column;gap:11px;
    scrollbar-width:none;
    overscroll-behavior:contain;
  }
  .notes-scroll::-webkit-scrollbar{display:none}

  .note-card{
    background:var(--bg2);border:0.5px solid var(--border2);
    border-radius:16px;padding:13px 15px;position:relative;
    animation:slideIn 0.22s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .note-meta{
    font-size:11px;color:var(--txt3);
    margin-bottom:7px;display:flex;align-items:center;gap:6px;
    font-family:'Nunito',sans-serif;
  }
  .note-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);display:inline-block;flex-shrink:0}
  .note-text{font-size:15px;line-height:1.65;color:var(--txt);word-break:break-word}
  .note-imgs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .note-img{
    width:72px;height:72px;border-radius:10px;object-fit:cover;
    border:0.5px solid var(--border2);cursor:pointer;
    transition:opacity 0.15s;
  }
  .note-img:active{opacity:0.75}
  .note-del{
    position:absolute;top:11px;right:11px;
    width:30px;height:30px;border-radius:50%;
    background:rgba(224,92,92,0.15);border:none;
    color:var(--red);font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;transition:opacity 0.2s;
    line-height:1;
  }
  .note-card:active .note-del{opacity:1}

  .empty{
    text-align:center;padding:50px 20px;
    color:var(--txt3);font-size:14px;line-height:1.8;
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .empty svg{opacity:0.3;margin-bottom:14px}

  /* ── COMPOSER ── */
  .composer{
    background:var(--bg2);
    border-top:0.5px solid var(--border2);
    padding:10px 14px calc(12px + var(--safe-bottom));
    flex-shrink:0;
  }
  .rec-bar{
    display:flex;align-items:center;gap:8px;
    min-height:22px;margin-bottom:6px;
  }
  .rec-pulse{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);display:none;flex-shrink:0;
  }
  .rec-pulse.on{display:block;animation:blink 0.85s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}
  .rec-txt{font-size:11px;color:var(--red);letter-spacing:0.04em;font-family:'Nunito',sans-serif}
  .attach-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .attach-thumb{position:relative;width:50px;height:50px}
  .attach-thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:0.5px solid var(--border2)}
  .attach-x{
    position:absolute;top:-6px;right:-6px;
    width:18px;height:18px;border-radius:50%;
    background:var(--red);color:#fff;border:none;
    font-size:10px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;line-height:1;
  }
  .input-row{display:flex;gap:9px;align-items:flex-end}
  .textarea-wrap{flex:1;position:relative}
  textarea{
    width:100%;background:var(--bg3);
    border:0.5px solid var(--border2);
    border-radius:14px;padding:11px 14px;
    font-family:'Nunito Sans',sans-serif;font-size:15px;
    color:var(--txt);resize:none;outline:none;
    min-height:46px;max-height:110px;line-height:1.5;
    -webkit-appearance:none;display:block;
    transition:border-color 0.15s;
  }
  textarea:focus{border-color:var(--acc)}
  textarea::placeholder{color:var(--txt3)}
  .icon-btn{
    width:46px;height:46px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:transform 0.1s,background 0.15s;
    -webkit-user-select:none;user-select:none;
  }
  .icon-btn:active{transform:scale(0.88)}
  .btn-mic{background:var(--acc)}
  .btn-mic.recording{background:var(--red)}
  .btn-cam{background:var(--bg3);border:0.5px solid var(--border2)}
  .btn-save{
    width:46px;height:46px;border-radius:14px;border:none;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:transform 0.1s,opacity 0.15s;
  }
  .btn-save:active{transform:scale(0.88)}

  /* ── IMAGE MODAL ── */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.88);
    display:flex;align-items:center;justify-content:center;
    z-index:999;cursor:pointer;
    animation:fadeOverlay 0.18s ease;
  }
  @keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
  .modal-img{
    max-width:94vw;max-height:88vh;
    border-radius:12px;cursor:default;
    animation:zoomIn 0.18s cubic-bezier(0.22,1,0.36,1);
  }
  @keyframes zoomIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-close{
    position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,0.15);border:none;
    color:#fff;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  input[type=file]{display:none}
  svg.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-date" id="hDate"></div>
      <div class="topbar-wday" id="hWday"></div>
    </div>
    <div class="topbar-badge">daily notes</div>
  </div>

  <!-- DAY STRIP -->
  <div class="day-strip" id="dayStrip"></div>

  <!-- NOTES -->
  <div class="notes-scroll" id="notesList"></div>

  <!-- COMPOSER -->
  <div class="composer">
    <div class="rec-bar">
      <div class="rec-pulse" id="recPulse"></div>
      <span class="rec-txt" id="recTxt"></span>
    </div>
    <div class="attach-row" id="attachRow"></div>
    <div class="input-row">
      <button class="icon-btn btn-mic" id="micBtn" onclick="toggleRec()" aria-label="Record voice">
        <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0014 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="9" y1="22" x2="15" y2="22"/>
        </svg>
      </button>
      <div class="textarea-wrap">
        <textarea id="noteInput" placeholder="Tap mic or type a note…" rows="1"
          oninput="autoResize(this)"></textarea>
      </div>
      <label class="icon-btn btn-cam" for="imgIn" aria-label="Add photo">
        <svg class="icon" viewBox="0 0 24 24" style="stroke:#9e9bb8">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </label>
      <input type="file" id="imgIn" accept="image/*" multiple onchange="addImgs(this)">
      <button class="btn-save" onclick="saveNote()" aria-label="Save note">
        <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff;width:20px;height:20px">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<!-- IMAGE MODAL -->
<div class="modal-overlay" id="imgModal" style="display:none" onclick="closeModal()">
  <img class="modal-img" id="modalImg" src="" alt="Note photo" onclick="event.stopPropagation()">
  <button class="modal-close" onclick="closeModal()">&#10005;</button>
</div>

<script>
const STORAGE_KEY = 'daily_notes_v1';
let data = {};
let days = [];
let cur = null;
let pendImg = [];
let rec = null;
let isRec = false;
let accumText = '';

/* ── PERSISTENCE ── */
function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({data, days})); } catch(e) {}
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); data = p.data||{}; days = p.days||[]; }
  } catch(e) {}
}

/* ── DATE HELPERS ── */
function isoDate(d) { return d.toISOString().slice(0,10); }
function todayKey() { return isoDate(new Date()); }
function fmtFull(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}
function fmtWday(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long'});
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
}
function fmtDayNum(k) { return parseInt(k.split('-')[2],10); }
function fmtDayName(k) {
  const [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short'}).slice(0,2);
}

/* ── DATA ── */
function ensureDay(k) {
  if (!data[k]) data[k] = [];
  if (!days.includes(k)) { days.push(k); days.sort((a,b) => b.localeCompare(a)); }
}

/* ── RENDER ── */
function buildStrip() {
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  days.forEach(k => {
    const el = document.createElement('div');
    const hasNotes = data[k] && data[k].length > 0;
    el.className = 'day-pill' + (k===cur?' active':'') + (hasNotes?' has-notes':'');
    el.innerHTML = `<div class="day-pill-name">${fmtDayName(k)}</div><div class="day-pill-num">${fmtDayNum(k)}</div><div class="day-pill-dot"></div>`;
    el.onclick = () => { cur = k; buildStrip(); renderNotes(); };
    strip.appendChild(el);
  });
  const active = strip.querySelector('.active');
  if (active) active.scrollIntoView({inline:'center', behavior:'smooth'});
}

function renderNotes() {
  document.getElementById('hDate').textContent = fmtFull(cur);
  document.getElementById('hWday').textContent = fmtWday(cur);
  const list = document.getElementById('notesList');
  const notes = (data[cur] || []);
  if (!notes.length) {
    list.innerHTML = `<div class="empty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9e9bb8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M9 9a3 3 0 016 0c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      No notes yet for this day.<br>Tap the mic or type below.
    </div>`;
    return;
  }
  list.innerHTML = '';
  notes.forEach((n, i) => {
    const card = document.createElement('div');
    card.className = 'note-card';
    const imgs = n.images && n.images.length
      ? `<div class="note-imgs">${n.images.map((s,j) =>
          `<img class="note-img" src="${s}" alt="Photo ${j+1}" onclick="openModal('${s}')">`
        ).join('')}</div>` : '';
    card.innerHTML = `
      <div class="note-meta"><span class="note-dot"></span>${fmtTime(n.ts)}</div>
      <div class="note-text">${escHtml(n.text)}</div>
      ${imgs}
      <button class="note-del" onclick="delNote('${cur}',${i})" aria-label="Delete note">&#10005;</button>`;
    list.appendChild(card);
  });
}

function escHtml(t) {
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

/* ── SAVE / DELETE ── */
function saveNote() {
  const inp = document.getElementById('noteInput');
  const txt = inp.value.trim();
  if (!txt && !pendImg.length) return;
  ensureDay(cur);
  data[cur].unshift({text: txt, ts: Date.now(), images: [...pendImg]});
  inp.value = ''; inp.style.height = 'auto';
  pendImg = [];
  document.getElementById('attachRow').innerHTML = '';
  saveToStorage();
  buildStrip(); renderNotes();
}

function delNote(k, i) {
  data[k].splice(i, 1);
  saveToStorage();
  buildStrip(); renderNotes();
}

/* ── IMAGES ── */
function addImgs(inp) {
  const MAX = 5;
  Array.from(inp.files).slice(0, MAX - pendImg.length).forEach(f => {
    const r = new FileReader();
    r.onload = e => { pendImg.push(e.target.result); renderAttach(); };
    r.readAsDataURL(f);
  });
  inp.value = '';
}
function renderAttach() {
  document.getElementById('attachRow').innerHTML = pendImg
    .map((s,i) => `<div class="attach-thumb"><img src="${s}" alt="Attachment"><button class="attach-x" onclick="rmAttach(${i})">&#10005;</button></div>`)
    .join('');
}
function rmAttach(i) { pendImg.splice(i,1); renderAttach(); }

/* ── VOICE ── */
function toggleRec() {
  if (isRec) { stopRec(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('recTxt').textContent = 'Speech API not available in this browser.';
    return;
  }
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = 'en-US';
  const inp = document.getElementById('noteInput');
  accumText = inp.value.trim();

  rec.onstart = () => {
    isRec = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('recPulse').classList.add('on');
    document.getElementById('recTxt').textContent = 'Listening…';
  };
  rec.onresult = e => {
    let fin = '', inter = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) fin += e.results[i][0].transcript + ' ';
      else inter += e.results[i][0].transcript;
    }
    if (fin) accumText = (accumText + ' ' + fin).trim();
    inp.value = accumText + (inter ? ' ' + inter : '');
    autoResize(inp);
  };
  rec.onend = stopRec;
  rec.onerror = stopRec;
  rec.start();
}

function stopRec() {
  try { rec && rec.stop(); } catch(e) {}
  isRec = false;
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('recPulse').classList.remove('on');
  document.getElementById('recTxt').textContent = '';
}

/* ── UI HELPERS ── */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

function openModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').style.display = 'flex';
}
function closeModal() {
  document.getElementById('imgModal').style.display = 'none';
}

document.getElementById('noteInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveNote(); }
});

/* ── INIT ── */
loadFromStorage();
const today = todayKey();
const past = [...Array(14)].map((_,i) => {
  const d = new Date(); d.setDate(d.getDate()-i); return isoDate(d);
});
past.forEach(ensureDay);
cur = today;
buildStrip();
renderNotes();
</script>
</body>
</html>
